version: "3.9"
services:
  backend:
    image: localhost/openshift-airgap-architect-backend:latest
    build:
      context: .
      dockerfile: backend/Containerfile
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
    # Runtime corporate egress: HTTP_PROXY, HTTPS_PROXY, NO_PROXY on this service (README
    # "Corporate HTTP proxy and backend egress"). Image build curl/npm use the build host proxy.
    # Wizard proxy fields in the UI are for the OpenShift cluster only, not this app.
    environment:
      - PORT=4000
      - DATA_DIR=/data
      # The backend binds the address it was told to bind (backend/src/accessControl.js).
      # A published port forwards to the CONTAINER's address, never to the container's
      # loopback, so a container that binds 127.0.0.1 is unreachable through `ports:`
      # below. These two lines are that exception, stated explicitly rather than
      # inherited from a default:
      #
      #   BIND_ADDRESS          — the interface inside the container's own network
      #                           namespace;
      #   OAA_CONTAINER_NETWORK — the declaration that the namespace IS the boundary.
      #                           The backend refuses it unless it can also see that it
      #                           is genuinely in a container, so copying these lines
      #                           into a systemd unit on a host fails closed.
      #
      # THE OPERATOR-FACING BOUNDARY IS THE `ports:` MAPPING BELOW, which publishes to
      # 127.0.0.1 only. A process inside a container cannot observe how its ports were
      # published: change `127.0.0.1:4000:4000` to `4000:4000`, or run with
      # --network=host, and an UNAUTHENTICATED API is on every interface. Set
      # OAA_AUTH_MODE=proxy (with OAA_PROXY_SHARED_SECRET and OAA_ALLOWED_ORIGINS)
      # before exposing this to anything but your own machine.
      - BIND_ADDRESS=0.0.0.0
      - OAA_CONTAINER_NETWORK=isolated
      # REGISTRY_AUTH_FILE is intentionally NOT set here. oc-mirror v2's internal
      # distribution/distribution storage registry reads REGISTRY_* env vars as YAML
      # registry config parameters — setting it to a JSON auth file path causes a
      # panic on startup. Auth is passed via --authfile flag by the backend instead.
      - MOCK_MODE=${MOCK_MODE:-false}
      - FEEDBACK_MODE=${FEEDBACK_MODE:-github}
      - APP_REPO=${APP_REPO:-bstrauss84/openshift-airgap-architect}
      - APP_BRANCH=${APP_BRANCH:-main}
    volumes:
      - backend-data:/data
    ports:
      - "127.0.0.1:4000:4000"
    stop_grace_period: 3s
    stop_signal: SIGTERM
  frontend:
    image: localhost/openshift-airgap-architect-frontend:latest
    build:
      context: .
      dockerfile: frontend/Containerfile
    environment:
      # For remote access, set to URL reachable from the client (e.g. http://<host>:4000). See README "Same-host vs remote access".
      - VITE_API_BASE=http://localhost:4000
      # Optional: comma-separated hostnames when the UI is opened by DNS name (no spaces). See README "Running behind a reverse proxy".
      # Set on the host, e.g. VITE_ALLOWED_HOSTS=app.example.com podman compose up --build, or add to compose.override.yml.
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    stop_grace_period: 3s
    stop_signal: SIGTERM
# To mount external storage for large oc-mirror archives (50–200+ GB per OCP release + operators),
# create a compose.override.yml in the same directory as this file:
#
#   services:
#     backend:
#       volumes:
#         - /path/to/large-drive/oc-mirror:/data/oc-mirror
#
# Then restart: podman compose down --remove-orphans && podman compose up --build -d
# (data in backend-data volume is preserved unless you pass -v to compose down)
volumes:
  backend-data:
