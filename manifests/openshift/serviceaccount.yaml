# ServiceAccount for the authenticated deployment.
#
# TWO JOBS, and the second is what makes built-in OpenShift OAuth work without
# registering an OAuthClient by hand.
#
# 1. A dedicated identity for the workload (PROD-028). The default
#    ServiceAccount is shared by everything in the namespace, so a role bound
#    to it is a role granted to everything.
#
# 2. The `serviceaccounts.openshift.io/oauth-redirectreference.*` annotation
#    turns this ServiceAccount into an OAuth client. `oauth-proxy` started
#    with `--openshift-service-account=airgap-architect` authenticates against
#    the cluster's BUILT-IN OAuth server using the SA token, and the OAuth
#    server accepts the redirect URI because this annotation declares it by
#    reference to the named Route. That is the whole reason no OAuthClient
#    object appears in this overlay.
#
# IF THE CLUSTER USES EXTERNAL OIDC THIS DOES NOT WORK, and will not silently
# degrade. OpenShift 4.22 with direct external OIDC removes the built-in OAuth
# server and the oauth.openshift.io APIs, so the SA-as-OAuth-client mechanism
# has nothing to talk to. The backend refuses to start if OAA_OIDC_ISSUER is
# set, so the failure is stated rather than presenting as a login loop. See
# docs/security/DECISION_RECORD_API_EXPOSURE_AND_TRUST_ANCHORS.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airgap-architect
  labels:
    app: airgap-architect
    app.kubernetes.io/name: airgap-architect
    app.kubernetes.io/part-of: airgap-architect
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"airgap-architect"}}
---
# The backend does not call the Kubernetes API and must not carry a token it
# has no use for. A mounted SA token in a pod that processes operator-supplied
# input is credential surface for nothing in return.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airgap-architect-backend
  labels:
    app: airgap-architect
    app.kubernetes.io/name: airgap-architect-backend
    app.kubernetes.io/part-of: airgap-architect
automountServiceAccountToken: false
