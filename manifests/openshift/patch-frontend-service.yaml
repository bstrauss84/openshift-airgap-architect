# Expose ONLY the oauth-proxy port, and have OpenShift issue its serving
# certificate.
#
# JSON 6902, not a strategic merge, and that choice is load-bearing. Service
# ports merge on `port`, so a strategic merge that lists only 8443 ADDS it and
# leaves the base's 5173 in place — which is how an earlier revision ended up
# publishing the unauthenticated nginx port on the Service while its own
# comment said nothing outside the pod should reach it. `replace` on
# /spec/ports states the whole set, so the only thing this Service exposes is
# the authenticating hop.
#
# nginx now binds 127.0.0.1:5173 inside the pod (patch-frontend-oauth.yaml), so
# a Service port pointing at it would have nothing to connect to anyway. Both
# halves are deliberate: the kernel refuses the connection, and nothing offers
# it. Probes use the probe-only listener on 8081, which is not a Service port
# either — the kubelet reaches the pod directly.
#
# The `service.beta.openshift.io/serving-cert-secret-name` annotation makes the
# service CA operator mint a TLS key pair into the named Secret and rotate it
# automatically. That is why no private key appears anywhere in this repository
# and why nothing here has to be generated by hand: the cluster is the CA. It is
# also what makes the reencrypt Route work without a destinationCACertificate —
# the router validates the pod certificate against the service CA bundle it
# already mounts (see route-frontend.yaml).
- op: add
  path: /metadata/annotations
  value:
    service.beta.openshift.io/serving-cert-secret-name: airgap-architect-proxy-tls
- op: replace
  path: /spec/ports
  value:
    - name: public
      port: 8443
      targetPort: 8443
      protocol: TCP
