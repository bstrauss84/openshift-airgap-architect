apiVersion: v1
kind: ConfigMap
metadata:
  name: airgap-architect-config
  labels:
    app: airgap-architect
    app.kubernetes.io/name: airgap-architect-config
    app.kubernetes.io/part-of: airgap-architect
data:
  # Backend listen port (must match containerPort in backend Deployment)
  PORT: "4000"

  # Node.js environment
  NODE_ENV: "production"

  # Log verbosity: trace, debug, info, warn, error, fatal
  LOG_LEVEL: "info"

  # Set to "true" to return mock data without real oc/oc-mirror calls (dev/demo only)
  MOCK_MODE: "false"

  # Feedback submission backend: "github" posts issues to APP_REPO
  FEEDBACK_MODE: "github"

  # Enable automatic update checks against the GitHub repo
  CHECK_UPDATES: "true"

  # GitHub repository for build-info and update checks
  APP_REPO: "bstrauss84/openshift-airgap-architect"

  # Git branch to check for updates
  APP_BRANCH: "main"

  # Where the BROWSER sends API calls. This value is written into
  # /runtime-config.js at container start and read by the page, so it is
  # resolved by the user's browser — not by the frontend pod.
  #
  # It used to be "http://airgap-architect-backend:4000". That is an in-cluster
  # Service DNS name, and a browser outside the cluster cannot resolve it, so
  # every API call failed with a name-resolution error and the only documented
  # way out was to publish the backend on its own Ingress/Route — exposing the
  # API directly, which is the exposure the authenticated overlay exists to
  # close.
  #
  # "/api" is same-origin: the page calls its own host, and the nginx block in
  # the frontend image proxies /api/ to the backend Service in-cluster. The
  # upstream defaults to http://airgap-architect-backend:4000 and is
  # overridable with OAA_BACKEND_ORIGIN. This is the same value the OpenShift
  # overlay uses, so one origin is the shape in both, and no backend Route is
  # needed to make the UI work.
  VITE_API_BASE: "/api"

  # Comma-separated hostnames allowed by the Vite dev server.
  # Set to the external hostname(s) used to reach the frontend (Route, Ingress, etc.).
  # Leave empty to allow all hosts.
  VITE_ALLOWED_HOSTS: ""
