# TEMPLATE ONLY — NOT APPLIED BY THE KUSTOMIZATION, AND MUST NOT BE RE-ADDED.
#
# This file documents the key names the backend expects. It is deliberately
# absent from `manifests/base/kustomization.yaml`: the empty `stringData`
# values below are *present* values as far as `oc apply`'s three-way merge is
# concerned, so applying this after you created the real Secret out of tree
# would blank your Red Hat pull secret. Create the Secret with
# `oc create secret generic` instead (manifests/README.md, step 2).
apiVersion: v1
kind: Secret
metadata:
  name: airgap-architect-secrets
  labels:
    app: airgap-architect
    app.kubernetes.io/name: airgap-architect-secrets
    app.kubernetes.io/part-of: airgap-architect
type: Opaque
stringData:
  # ------------------------------------------------------------------
  # USER MUST POPULATE THESE VALUES BEFORE DEPLOYING
  # ------------------------------------------------------------------
  #
  # Red Hat pull secret (JSON from https://console.redhat.com/openshift/install/pull-secret).
  # Used by oc-mirror to authenticate to registry.redhat.io and quay.io.
  # Read server-side only; the contents are never sent to the browser.
  #
  # NOTE (PROD-035): this Secret is not currently referenced by
  # manifests/base/backend-deployment.yaml, so populating it has no effect yet.
  # Prefer creating the Secret out of tree, e.g.
  #   kubectl create secret generic airgap-architect-secrets \
  #     --from-file=pull-secret.json=/path/to/pull-secret.json
  # rather than pasting a live credential into this tracked file.
  pull-secret.json: ""
  #
  # Mirror registry credentials (JSON).
  # If you mirror images to a private registry, add its auth entry here.
  # Format: {"auths":{"my-registry.example.com:5000":{"auth":"base64..."}}}
  registry-auth.json: ""
